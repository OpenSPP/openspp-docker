version: "2.4"

services:
  odoo:
    image: openspp/openspp:19.0
    build:
      context: ./odoo
      args:
        DB_VERSION: "18"
        ODOO_VERSION: "19.0"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    environment:
      EMAIL_FROM: "contact@openspp.org"
      PGDATABASE: &dbname prod
      PGUSER: &dbuser "odoo"
      PROXY_MODE: "true"
      PYTHONWARNINGS: "ignore::DeprecationWarning:imghdr"
      CLAMAV_HOST: "clamav"
      CLAMAV_PORT: "3310"
      # Master key for spp_key_management encryption (base64-encoded 32 bytes)
      # Generate with: python -c "import secrets, base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"
      SPP_MASTER_KEY: "${SPP_MASTER_KEY:-}"
    tty: true
    volumes:
      - filestore:/var/lib/odoo:z

  db:
    platform: linux/amd64
    image: ghcr.io/openspp/postgres-autoconf:18-alpine
    shm_size: 4gb
    environment:
      POSTGRES_DB: *dbname
      POSTGRES_USER: *dbuser
      CONF_EXTRA: |
        work_mem = 512MB
        max_connections = 200
        shared_buffers = 1GB
        effective_cache_size = 3GB
        maintenance_work_mem = 256MB
        checkpoint_completion_target = 0.9
        wal_buffers = 16MB
        default_statistics_target = 100
        random_page_cost = 1.1
        effective_io_concurrency = 200
        work_mem = 2621kB
        huge_pages = off
        min_wal_size = 1GB
        max_wal_size = 4GB

    volumes:
      - db:/var/lib/postgresql/data:z

  smtpfake:
    platform: linux/amd64
    image: docker.io/mailhog/mailhog

  clamav:
    platform: linux/amd64
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav:z

  backup:
    image: ghcr.io/tecnativa/docker-duplicity-postgres-s3:latest
    hostname: backup.demo.openspp.org
    init: true
    environment:
      DB_VERSION: "18"
      DBS_TO_INCLUDE: "^prod"
      DST: "boto3+s3://example_bucket"
      PGDATABASE: *dbname
      PGUSER: *dbuser
      TZ: "UTC"
    volumes:
      - backup_cache:/root:z
      - filestore:/mnt/backup/src/odoo:z
