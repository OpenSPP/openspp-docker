services:
  odoo_proxy:
    platform: linux/amd64
    image: ghcr.io/tecnativa/docker-whitelist:latest
    depends_on:
      - odoo
    networks: &public
      default:
      public:
    ports:
      - "127.0.0.1:${PORT_PREFIX:-19}899:6899"
      - "127.0.0.1:${PORT_PREFIX:-19}069:8069"
      - "127.0.0.1:${PORT_PREFIX:-19}072:8072"
    environment:
      PORT: "6899 8069 8072"
      TARGET: odoo

  odoo:
    privileged: true
    extends:
      file: common.yaml
      service: odoo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      args:
        # To aggregate in development, use `setup-devel.yaml`
        AGGREGATE: "false"
        # Export these variables to own files created by odoo in your filesystem
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        # No need for this in development
        PIP_INSTALL_ODOO: "false"
        CLEAN: "false"
        COMPILE: "false"
    environment:
      DOODBA_ENVIRONMENT: "${DOODBA_ENVIRONMENT-devel}"
      INITIAL_LANG: "en_US"
      LIST_DB: "false"
      DBFILTER: "^devel$$"
      DEBUGPY_ENABLE: "${DOODBA_DEBUGPY_ENABLE:-0}"
      PGDATABASE: &dbname devel
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONOPTIMIZE: ""
      PYTHONPATH: /opt/odoo/custom/src/odoo
      SMTP_PORT: "1025"
      WDB_WEB_PORT: "${PORT_PREFIX:-19}984"
      # To avoid installing demo data export DOODBA_WITHOUT_DEMO=all
      WITHOUT_DEMO: "${DOODBA_WITHOUT_DEMO-false}"
      # Development master key for spp_key_management (DO NOT use in production!)
      SPP_MASTER_KEY: "${SPP_MASTER_KEY:-8pBUQWE3QVfTH0JCnpuXyxMOY4RtxGCkDWmfLHggXag=}"
      # Enable queue_job channels for DCI async operations
      ODOO_QUEUE_JOB_CHANNELS: "root:2,root.dci:2"
    volumes:
      - ./odoo/custom:/opt/odoo/custom:rw,z
      - ./odoo/auto:/opt/odoo/auto:rw,z
    depends_on:
      - db
      - proxy_cdnjs_cloudflare_com
      - proxy_fonts_googleapis_com
      - proxy_fonts_gstatic_com
      - proxy_www_google_com
      - proxy_www_googleapis_com
      - proxy_www_gravatar_com
      - smtp
      - wdb
    command:
      - odoo
      - --limit-memory-soft=0
      - --limit-time-real-cron=9999999
      - --limit-time-real=9999999
      - --workers=0
      - --dev=reload,qweb,werkzeug,xml,access
      - --database=devel
      - --db-filter=^devel$

  odoo_queue_worker:
    extends:
      file: common.yaml
      service: odoo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      args:
        AGGREGATE: "false"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        PIP_INSTALL_ODOO: "false"
        CLEAN: "false"
        COMPILE: "false"
    environment:
      DOODBA_ENVIRONMENT: "${DOODBA_ENVIRONMENT-devel}"
      PGDATABASE: *dbname
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONOPTIMIZE: ""
      PYTHONPATH: /opt/odoo/custom/src/odoo
      WITHOUT_DEMO: "${DOODBA_WITHOUT_DEMO-false}"
      SPP_MASTER_KEY: "${SPP_MASTER_KEY:-8pBUQWE3QVfTH0JCnpuXyxMOY4RtxGCkDWmfLHggXag=}"
      ODOO_QUEUE_JOB_CHANNELS: "root:2,root.dci:2"
    volumes:
      - ./odoo/custom:/opt/odoo/custom:rw,z
      - ./odoo/auto:/opt/odoo/auto:rw,z
    depends_on:
      - db
    command:
      - odoo
      - --database=devel
      - --db-filter=^devel$
      - --workers=2
      - --max-cron-threads=0

  db:
    extends:
      file: common.yaml
      service: db
    networks: *public
    ports:
      - "127.0.0.1:17432:5432"
    environment:
      POSTGRES_DB: *dbname
      POSTGRES_PASSWORD: odoopassword

  pgweb:
    platform: linux/amd64
    image: docker.io/sosedoff/pgweb
    networks: *public
    ports:
      - "127.0.0.1:${PORT_PREFIX:-19}081:8081"
    environment:
      DATABASE_URL: postgres://odoo:odoopassword@db:5432/devel?sslmode=disable
    depends_on:
      - db

  smtp:
    extends:
      file: common.yaml
      service: smtpfake
    networks: *public
    ports:
      - "127.0.0.1:${PORT_PREFIX:-19}025:8025"

  clamav:
    extends:
      file: common.yaml
      service: clamav

  wdb:
    platform: linux/amd64
    image: docker.io/kozea/wdb
    networks: *public
    ports:
      - "127.0.0.1:${PORT_PREFIX:-19}984:1984"
    # HACK https://github.com/Kozea/wdb/issues/136
    init: true

  # Whitelist outgoing traffic for tests, reports, etc.
  proxy_cdnjs_cloudflare_com:
    platform: linux/amd64
    image: ghcr.io/tecnativa/docker-whitelist:latest
    networks:
      default:
        aliases:
          - cdnjs.cloudflare.com
      public:
    environment:
      TARGET: cdnjs.cloudflare.com
      PRE_RESOLVE: 1

  proxy_fonts_googleapis_com:
    platform: linux/amd64
    image: ghcr.io/tecnativa/docker-whitelist:latest
    networks:
      default:
        aliases:
          - fonts.googleapis.com
      public:
    environment:
      TARGET: fonts.googleapis.com
      PRE_RESOLVE: 1

  proxy_fonts_gstatic_com:
    platform: linux/amd64
    image: ghcr.io/tecnativa/docker-whitelist:latest
    networks:
      default:
        aliases:
          - fonts.gstatic.com
      public:
    environment:
      TARGET: fonts.gstatic.com
      PRE_RESOLVE: 1

  proxy_www_google_com:
    platform: linux/amd64
    image: ghcr.io/tecnativa/docker-whitelist:latest
    networks:
      default:
        aliases:
          - www.google.com
      public:
    environment:
      TARGET: www.google.com
      PRE_RESOLVE: 1

  proxy_www_googleapis_com:
    platform: linux/amd64
    image: ghcr.io/tecnativa/docker-whitelist:latest
    networks:
      default:
        aliases:
          - www.googleapis.com
      public:
    environment:
      TARGET: www.googleapis.com
      PRE_RESOLVE: 1

  proxy_www_gravatar_com:
    platform: linux/amd64
    image: ghcr.io/tecnativa/docker-whitelist:latest
    networks:
      default:
        aliases:
          - www.gravatar.com
      public:
    environment:
      TARGET: www.gravatar.com
      PRE_RESOLVE: 1

networks:
  default:
    internal: ${DOODBA_NETWORK_INTERNAL-true}
  public:

volumes:
  filestore:
  db:
  clamav_db:
