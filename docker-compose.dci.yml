  # ============================================
  # COMPLIANCE TEST RUNNERS
  # These run the Gherkin/Cucumber tests from SPDCI repos
  # ============================================

  # SR Compliance: Tests OpenSPP as a Social Registry SERVER
  # Uses SPDCI compliance test suite with built-in callback server
  #
  # IMPORTANT: For async callbacks to work, the queue_worker must be restarted
  # AFTER this container starts, so Docker DNS can resolve 'sr_compliance'.
  # The STARTUP_DELAY_SECONDS env var controls how long to wait before running
  # tests, giving time for queue_worker to be restarted externally.
  sr_compliance:
    image: node:20-slim
    working_dir: /app
    depends_on:
      - odoo
      - odoo_queue_worker
    environment:
      # OpenSPP SR server endpoint (via Docker network)
      API_BASE_URL: http://openspp.dci.local:8069/dci_api/v1/social/
      # Bearer token for authentication
      DCI_AUTH_TOKEN: ${DCI_AUTH_TOKEN:-compliance-test-api-key-12345}
      # Callback server settings - sr_compliance container acts as callback receiver
      CALLBACK_SERVER_ENABLED: "true"
      CALLBACK_SERVER_HOST: sr_compliance
      CALLBACK_SERVER_LISTEN_HOST: "0.0.0.0"
      CALLBACK_SERVER_PORT: "19999"
      # Callback wait time - must be long enough for queue_job to process
      CALLBACK_WAIT_MS: ${CALLBACK_WAIT_MS:-45000}
      # Step timeout for cucumber - must be >= CALLBACK_WAIT_MS
      CUCUMBER_STEP_TIMEOUT_MS: ${CUCUMBER_STEP_TIMEOUT_MS:-60000}
      # Test domain
      DOMAIN: social
      # Startup delay to allow queue_worker restart (set by invoke task)
      STARTUP_DELAY_SECONDS: ${STARTUP_DELAY_SECONDS:-0}
    volumes:
      # Mount the spdci-compliance test suite (read-write for npm install)
      - ./dci/submodules/spdci-compliance:/app
      # Mount results directory (writable)
      - ./dci/results/sr:/app/results
    networks:
      dci_compliance:
        aliases:
          - sr_compliance
    profiles:
      - sr-test
      - all-tests
    command: >
      sh -c "
        echo 'Installing dependencies...' &&
        npm ci --prefer-offline 2>/dev/null || npm install &&
        if [ \"$$STARTUP_DELAY_SECONDS\" -gt 0 ]; then
          echo \"Waiting $$STARTUP_DELAY_SECONDS seconds for queue_worker to
      restart...\" &&
          sleep $$STARTUP_DELAY_SECONDS;
        fi &&
        echo 'Running SR compliance tests...' &&
        npm test -- --tags '@profile=sr-registry'
      "

  # ============================================
  # CLIENT COMPLIANCE TEST INFRASTRUCTURE
  # Tests OpenSPP's DCI client (spp_dci_client) against a mock registry
  # ============================================

  # Mock Registry Server for Client Compliance Testing
  # This server validates incoming requests from our DCI client
  # and provides an admin API for test assertions
  mock_registry:
    image: node:20-slim
    working_dir: /app
    environment:
      PORT: "3335"
      DOMAIN: social
    volumes:
      - ./dci/submodules/spdci-compliance:/app
    networks:
      dci_compliance:
        aliases:
          - mock_registry
    profiles:
      - client-compliance
      - all-tests
    command: >
      sh -c "
        npm ci --prefer-offline 2>/dev/null || npm install &&
        echo 'Starting mock registry server on port 3335...' &&
        node common/mock-server/server.mjs
      "
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3335/admin/healthcheck', (r) =>
          process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Client Compliance Test Runner
  # Triggers our DCI client via the trigger endpoints and validates
  # that requests sent to mock_registry are spec-compliant
  client_compliance:
    image: node:20-slim
    working_dir: /app
    depends_on:
      mock_registry:
        condition: service_healthy
      odoo:
        condition: service_started
    environment:
      # Mock registry admin API for assertions
      MOCK_REGISTRY_ADMIN_URL: http://mock_registry:3335/admin
      # Client trigger endpoint (our spp_dci_client_compliance module)
      CLIENT_TRIGGER_URL: http://openspp.dci.local:8069/dci/test/trigger
      # Test domain
      DOMAIN: social
      # Startup delay
      STARTUP_DELAY_SECONDS: ${STARTUP_DELAY_SECONDS:-10}
    volumes:
      - ./dci/submodules/spdci-compliance:/app
      - ./dci/results/client:/app/results
    networks:
      dci_compliance:
    profiles:
      - client-compliance
      - all-tests
    command: >
      sh -c "
        npm ci --prefer-offline 2>/dev/null || npm install &&
        if [ \"$$STARTUP_DELAY_SECONDS\" -gt 0 ]; then
          echo \"Waiting $$STARTUP_DELAY_SECONDS seconds for services to be ready...\"
      &&
          sleep $$STARTUP_DELAY_SECONDS;
        fi &&
        echo 'Running client compliance tests...' &&
        npm test -- --tags '@profile=spmis-client and not @req=SP-CORE-CL-CONTENTTYPE-01
      and not @req=SP-SEC-CL-AUTH-01 and not @req=SPDCI-CL-CONTENTTYPE-01' "

