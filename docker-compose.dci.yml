# docker-compose.dci.yml
# DCI Compliance Testing Infrastructure for OpenSPP
#
# IMPORTANT: For callback tests to work correctly, services must be started
# in the correct order. The queue worker needs to be able to resolve the
# sr_compliance hostname, which requires sr_compliance to be running first.
#
# Usage (Recommended - Use the test script):
#   ./scripts/run-dci-tests.sh sr       # Run SR server compliance tests
#   ./scripts/run-dci-tests.sh all      # Run all tests
#
# Manual Usage:
#   # Step 1: Start Odoo with DCI network
#   docker compose -f devel.yaml -f docker-compose.dci.yml up -d odoo db
#
#   # Step 2: Run tests (this will start sr_compliance and restart queue_worker)
#   docker compose -f devel.yaml -f docker-compose.dci.yml --profile sr-test run --rm sr_compliance
#
# Profiles:
#   sr-test      - Test OpenSPP as Social Registry server
#   crvs-test    - Test CRVS client with mock registry
#   dr-test      - Test DR client with mock registry
#   ibr-test     - Test IBR client with mock registry
#   fr-test      - Test FR client with mock registry
#   client-tests - All client tests (CRVS, DR, IBR, FR)
#   all-tests    - All tests (SR server + all clients)
#   mocks-only   - Start mock registries without running tests
#
# Environment Variables:
#   DCI_AUTH_TOKEN          - Bearer token for API auth (default: compliance-test-api-key-12345)
#   CALLBACK_WAIT_MS        - How long to wait for callbacks (default: 45000ms)
#   CUCUMBER_STEP_TIMEOUT_MS - Cucumber step timeout (default: 60000ms)

services:
  # ============================================
  # ODOO NETWORK EXTENSION
  # Join the DCI compliance network so tests can reach Odoo
  # ============================================
  odoo:
    networks:
      default:
      dci_compliance:
        aliases:
          - openspp.dci.local

  # Queue worker also needs to be on the DCI network for callbacks
  odoo_queue_worker:
    networks:
      default:
      dci_compliance:

